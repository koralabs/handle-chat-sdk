name: PR Build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pr-tests:
    name: Build SDK
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
    - uses: actions/checkout@v4
      with:
        repository: koralabs/chat.handle.me
        path: chat-source
    - name: Stage the upstream client source beside the SDK
      run: mv chat-source ../chat.handle.me
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Install the upstream WASM build tool
      run: cargo install wasm-pack --version 0.13.1 --locked
    - uses: arduino/setup-protoc@v3
      with:
        version: '29.3'
    - run: npm ci
    - run: npm run build
